<html lang="en">

<style>
:root{
  --bg:#0f1115; --card:#1a1d24; --card2:#232733; --line:#2e3340;
  --text:#e8eaed; --muted:#9aa0aa; --accent:#22c55e; --accent2:#16a34a;
  --red:#ef4444; --blue:#3b82f6; --orange:#f59e0b; --purple:#a855f7; --yellow:#eab308;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(70px + env(safe-area-inset-bottom))}
header{padding:14px 16px 6px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:20px;margin:0}
main{padding:0 16px 16px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:14px;margin:10px 0}
.muted{color:var(--muted)} .small{font-size:13px} .center{text-align:center}
.big{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center} .row>*{flex:1}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
button{font:inherit;border:0;border-radius:12px;padding:14px;background:var(--card2);color:var(--text);font-weight:600;cursor:pointer;width:100%}
button:active{transform:scale(.98);opacity:.85}
button:disabled{opacity:.5}
.btn-go{background:var(--accent);color:#04210f;font-size:20px;padding:20px}
.btn-stop{background:var(--red);color:#fff;font-size:18px;padding:18px}
.btn-sm{padding:8px 12px;font-size:14px;width:auto}
.btn-link{background:none;color:var(--accent);padding:8px;width:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.stopbtn{padding:20px 6px;font-size:16px}
.stopbtn.pickup{background:#1e3a8a} .stopbtn.dropoff{background:#92400e}
.stopbtn.gas{background:#713f12} .stopbtn.break{background:#374151} .stopbtn.other{background:#3f3f46}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
textarea{min-height:90px}
.map{height:240px;border-radius:12px;overflow:hidden;margin:10px 0;background:#222}
.map.tall{height:320px}
.list .item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:8px}
.list .item:last-child{border-bottom:0}
.stat{background:var(--card2);border-radius:10px;padding:10px}
.stat .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .k{font-size:12px;color:var(--muted)}
.stat.hl{background:#14532d} .stat.hl .k{color:#bbf7d0}
.stat.blue{background:#1e3a5f} .stat.blue .k{color:#bfdbfe}
.money tr.b td{font-weight:700}
/* Pay / Tips drawn as branches under Gross Pay */
.money tr.parent td{border-bottom:none}
.money tr.sub td{border-bottom:none;padding-top:5px;padding-bottom:5px}
.money tr.sub.last td{border-bottom:1px solid var(--line);padding-bottom:9px}
.money tr.sub td:first-child{padding-left:32px;position:relative}
.money tr.sub td:first-child::before{content:'';position:absolute;left:10px;top:0;bottom:0;border-left:2px solid #6b7280}
.money tr.sub td:first-child::after{content:'';position:absolute;left:10px;top:50%;width:14px;border-top:2px solid #6b7280}
.money tr.sub.last td:first-child::before{bottom:calc(50% - 2px)}
.money tr.sub.last td:first-child::after{top:calc(50% - 2px);border-bottom-left-radius:4px}
.money tr.neg td{color:#f87171}
b.sec{display:block;font-size:17px;margin-bottom:4px}
.btn-danger{background:#4c1d1d;color:#fca5a5}
.stat.warn{background:#4c1d1d} .stat.warn .k{color:#fecaca} .stat.warn .v{color:#fca5a5}
.pbar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:8px}
.pbar div{height:100%;background:var(--accent);transition:width .4s}
.detail-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 0 4px}
.stop-count{background:var(--card2);border-radius:10px;padding:6px 12px;text-align:center;font-size:12px;color:var(--muted);line-height:1.1}
.stop-count span{display:block;font-size:22px;font-weight:700;color:var(--text)}
/* bar chart */
.chart-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.bars{display:grid;gap:4px;align-items:end}
.bcol{display:flex;flex-direction:column;align-items:stretch;min-width:0;position:relative}
.bcol.div::before{content:'';position:absolute;left:-3px;top:0;bottom:0;width:2px;background:var(--orange);border-radius:1px}
.bwrap{height:170px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.bval{font-size:12px;font-weight:700;margin-bottom:3px;white-space:nowrap;font-variant-numeric:tabular-nums}
.bmi-out{font-size:10px;color:var(--muted);margin-bottom:1px;white-space:nowrap}
.bar{width:100%;max-width:56px;background:var(--accent);border-radius:6px 6px 2px 2px;display:flex;align-items:center;justify-content:center;color:#04210f;font-size:11px;font-weight:600;text-align:center;line-height:1.15;overflow:hidden}
.bar.zero{background:var(--line);height:3px !important;border-radius:2px}
.blab{text-align:center;font-size:12px;color:var(--muted);margin-top:6px;line-height:1.25;white-space:nowrap}
.blab b{display:block;color:var(--text);font-weight:500}
.bcol.future .blab, .bcol.future .blab b{opacity:.45}
.bcol.today .blab, .bcol.today .blab b{color:var(--accent);font-weight:700}
.bars.compact .bval{font-size:10px} .bars.compact .bar{font-size:9px} .bars.compact .blab{font-size:10px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.money td{padding:7px 0} .money td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.money tr.total td{font-weight:700;border-top:2px solid var(--line)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.chip{white-space:nowrap;padding:8px 12px;border-radius:20px;background:var(--card2);font-size:14px;width:auto;font-weight:500}
.chip.on{background:var(--accent);color:#04210f}
nav{position:fixed;left:0;right:0;bottom:0;background:#14171d;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:1000}
nav button{background:none;border-radius:0;padding:10px 0 12px;font-size:12px;color:var(--muted);font-weight:500}
nav button .ic{display:block;font-size:20px;margin-bottom:2px}
nav button.on{color:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:2000;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.sheet h2{margin:4px 0 8px;font-size:20px}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:#000;color:#fff;padding:10px 16px;border-radius:10px;z-index:3000;font-size:14px;display:none;max-width:90vw;text-align:center}
.pin{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.exp-row{display:grid;grid-template-columns:1fr 100px 36px;gap:6px;margin-bottom:6px}
.exp-row button{padding:0;background:var(--card2)}
.leaflet-container{background:#ddd}
</style>
</head>
<body>
<header><h1 id="title">Mileage Tracker</h1><span><span id="hdr-sync" class="small" style="margin-right:8px"></span><span id="hdr-geo" class="small muted" style="margin-right:8px"></span><span id="hdr-right" class="small muted"></span></span></header>
<main id="main"></main>
<nav>
  <button data-nav="drive" class="on"><span class="ic">🚗</span>Drive</button>
  <button data-nav="history"><span class="ic">📋</span>History</button>
  <button data-nav="summary"><span class="ic">📊</span>Summary</button>
  <button data-nav="settings"><span class="ic">⚙️</span>Settings</button>
</nav>
<div id="toast"></div>
<div id="modal-root"></div>

<script>
/* ============ Storage ============ */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ toast('⚠️ Could not save — storage full? Make a backup.'); return false; } }
};
const DEFAULTS = { mpg:25, gasPrice:3.50, taxPct:25, irsRate:0.76, homeLabel:'Home', purpose:'Delivery driving (Walmart Spark)' };
let settings = Object.assign({}, DEFAULTS, LS.get('mt_settings', {}));
let shifts = LS.get('mt_shifts', []);
let active = LS.get('mt_active', null);
// soft = a background update (street addresses, map route). It still syncs, but never
// counts as a newer edit, so it can't overwrite a real change made on your other device.
const saveShifts = (soft) => { trackChanges(soft === true); LS.set('mt_shifts', shifts); scheduleSync(); };
const saveActive = () => active ? LS.set('mt_active', active) : localStorage.removeItem('mt_active');
const saveSettings = () => { settings.updated = Date.now(); LS.set('mt_settings', settings); scheduleSync(); };

/* ============ Google Sheet sync ============
   Every change to a shift is detected by fingerprinting it, stamped with the time,
   and sent to your Google Sheet. Changes made on your other device come back the
   same way. Newest edit wins. */
let sync = Object.assign({ url:'', key:'', since:0, lastPush:0, settingsPushed:0, lastOk:0, err:'' }, LS.get('mt_sync', {}));
let hashes = LS.get('mt_hashes', {});
let tomb = LS.get('mt_tomb', []);
let pending = new Set(LS.get('mt_pending', []));   // shift ids waiting to be sent
const savePending = () => LS.set('mt_pending', [...pending]);
const saveSync = () => LS.set('mt_sync', sync);
function h32(str){ let h = 5381; for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0; return h; }
function shiftHash(s){ const { updated, ...rest } = s; return h32(JSON.stringify(rest)); }
function trackChanges(soft){
  const seen = {}, now = Date.now();
  shifts.forEach(s => {
    const h = shiftHash(s); seen[s.id] = h;           // fingerprint ignores the 'updated' stamp
    if (hashes[s.id] === h) return;                   // unchanged
    const isNew = hashes[s.id] === undefined;
    if (!s.updated || (!soft && !isNew)) s.updated = now;  // real edits get a new time stamp
    pending.add(s.id);
  });
  Object.keys(hashes).forEach(id => { if (!(id in seen)){ tomb.push({ id, t: now }); pending.delete(id); } });
  hashes = seen;
  LS.set('mt_hashes', hashes); LS.set('mt_tomb', tomb); savePending();
}
function sheetRow(s){
  const c = calc(s);
  return {
    hours: +c.hours.toFixed(2),
    startLoc: [s.start.label, s.start.addr].filter(Boolean).join(' – '),
    endLoc: [s.end.label, s.end.addr].filter(Boolean).join(' – '),
    odo1: s.start.odo ?? '', odo2: s.end.odo ?? '', miles: +c.miles.toFixed(1), source: c.source,
    stops: (s.stops || []).length, pay: c.pay, tips: c.tips, gross: c.gross, gas: +c.gas.toFixed(2),
    expenses: c.expenses, net: +c.net.toFixed(2), tax: +c.tax.toFixed(2), takeHome: +c.takeHome.toFixed(2),
    hourlyGross: +c.hourlyGross.toFixed(2), hourlyTrue: +c.hourlyTrue.toFixed(2), irs: +c.irsDeduction.toFixed(2),
    stopList: (s.stops || []).slice().sort((a, b) => a.t - b.t).map(p => `${fmtTime(p.t)} ${TYPES[p.type]?.label || p.type}${p.addr ? ' @ ' + p.addr : ''}`).join(' | '),
    notes: s.notes || ''
  };
}
let syncing = false, syncAgain = false, syncTimer = null;
// first change starts a short timer; later changes ride along instead of pushing it back
function scheduleSync(ms = 4000){
  if (!sync.url || syncTimer) return;
  syncTimer = setTimeout(() => { syncTimer = null; doSync(); }, ms);
}
async function doSync(manual){
  if (!sync.url) return false;
  if (syncing){ syncAgain = true; return false; }
  syncing = true; updateSyncUI();
  let ok = false;
  try{
    trackChanges(true);
    const sent = shifts.filter(s => pending.has(s.id));
    const sentHash = {}; sent.forEach(s => sentHash[s.id] = hashes[s.id]);
    const outShifts = sent.map(s => ({ data: s, row: sheetRow(s) }));
    const sentTomb = tomb.slice();
    const sendSettings = (settings.updated || 0) > sync.settingsPushed ? settings : null;
    const r = await fetch(sync.url, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ key: sync.key, since: sync.since, shifts: outShifts, deleted: sentTomb, settings: sendSettings }) });
    let j;
    try{ j = await r.json(); }catch(e){ throw new Error('The sheet didn\'t answer correctly — check the web address (it should end in /exec)'); }
    if (!j.ok) throw new Error(j.error || 'Sync failed');
    Object.keys(sentHash).forEach(id => { if (hashes[id] === sentHash[id]) pending.delete(id); }); // unless changed again meanwhile
    savePending();
    if (sendSettings) sync.settingsPushed = sendSettings.updated || 0;
    tomb = tomb.filter(t => !sentTomb.includes(t)); LS.set('mt_tomb', tomb);
    const changed = applyRemote(j);
    sync.since = j.serverTime; sync.lastOk = Date.now(); sync.err = '';
    saveSync();
    ok = true;
    if (changed && view !== 'settings' && !$('#modal-root').innerHTML) render();
    if (manual) toast(changed ? '✅ Synced — got updates from your other device' : '✅ Synced');
  }catch(e){
    sync.err = navigator.onLine === false ? 'Offline — will sync when you have signal' : (e.message || 'Could not reach the sheet');
    saveSync();
    if (manual) toast('⚠️ ' + sync.err, 4000);
  }finally{
    syncing = false; updateSyncUI();
    if (syncAgain){ syncAgain = false; scheduleSync(1500); }
  }
  return ok;
}
function applyRemote(j){
  let changed = false;
  (j.deleted || []).forEach(id => {
    if (shifts.some(s => s.id === id)){ shifts = shifts.filter(s => s.id !== id); changed = true; }
    delete hashes[id];
  });
  (j.shifts || []).forEach(rs => {
    if (!rs || !rs.id || tomb.some(t => t.id === rs.id)) return;
    const local = shifts.find(s => s.id === rs.id);
    const ru = rs.updated || 0, lu = local ? (local.updated || 0) : 0;
    if (!local){ shifts.push(rs); }
    else if (ru > lu || (ru === lu && !pending.has(rs.id) && shiftHash(rs) !== hashes[rs.id])){
      Object.keys(local).forEach(k => delete local[k]); Object.assign(local, rs); // update in place so open screens keep working
    } else return;
    hashes[rs.id] = shiftHash(rs);
    pending.delete(rs.id);
    changed = true;
  });
  if (j.settings && (j.settings.updated || 0) > (settings.updated || 0)){
    settings = Object.assign({}, DEFAULTS, j.settings);
    LS.set('mt_settings', settings);
    sync.settingsPushed = settings.updated || 0;
    changed = true;
  }
  if (changed){ LS.set('mt_shifts', shifts); LS.set('mt_hashes', hashes); savePending(); }
  return changed;
}
function syncStatusText(){
  if (!sync.url) return 'Not connected';
  if (syncing) return 'Syncing…';
  if (sync.err) return '⚠️ ' + sync.err;
  return sync.lastOk ? 'Last synced ' + (sameDay(sync.lastOk, Date.now()) ? fmtTime(sync.lastOk) : fmtDate(sync.lastOk) + ' ' + fmtTime(sync.lastOk)) : 'Not synced yet';
}
function updateSyncUI(){
  const el = $('#sync-status'); if (el) el.textContent = syncStatusText();
  const h = $('#hdr-sync');
  if (h) h.textContent = !sync.url ? '' : syncing ? '☁️…' : sync.err ? '☁️⚠️' : '';
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});

/* ============ Helpers ============ */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { if (v === '' || v === null || v === undefined) return null; const n = parseFloat(String(v).replace(/[$,]/g,'')); return isNaN(n) ? null : n; };
const money = v => (v < 0 ? '-$' : '$') + Math.abs(v || 0).toFixed(2);
const mi = v => (v || 0).toFixed(1) + ' mi';
const fmtTime = t => new Date(t).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
const fmtDate = t => new Date(t).toLocaleDateString([], {weekday:'short', month:'short', day:'numeric', year:'numeric'});
const fmtDateShort = t => new Date(t).toLocaleDateString([], {month:'numeric', day:'numeric', year:'numeric'});
function fmtDur(ms){ ms = Math.max(0, ms); const h = Math.floor(ms/3.6e6), m = Math.floor(ms%3.6e6/6e4); return h ? `${h}h ${m}m` : `${m}m`; }
function fmtClock(ms){ ms = Math.max(0, ms); const h = Math.floor(ms/3.6e6), m = Math.floor(ms%3.6e6/6e4), s = Math.floor(ms%6e4/1000); return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }
const toLocalInput = t => { const d = new Date(t); return new Date(d.getTime() - d.getTimezoneOffset()*6e4).toISOString().slice(0,16); };
function haversine(a, b){ const R = 3958.8, r = x => x*Math.PI/180; const dLat = r(b.lat-a.lat), dLon = r(b.lon-a.lon); const h = Math.sin(dLat/2)**2 + Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
let toastTimer;
function toast(msg, ms=2500){ const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toastTimer); toastTimer = setTimeout(()=> t.style.display='none', ms); }

function getPos(){
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(
      p => res({lat:p.coords.latitude, lon:p.coords.longitude, acc:Math.round(p.coords.accuracy)}),
      () => res(null),
      {enableHighAccuracy:true, timeout:15000, maximumAge:5000});
  });
}

/* Keep screen awake during a shift (when the app is on screen) */
let wakeLock = null;
async function keepAwake(on){
  try{
    if (on && 'wakeLock' in navigator && !wakeLock){ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', ()=> wakeLock = null); }
    if (!on && wakeLock){ await wakeLock.release(); wakeLock = null; }
  }catch(e){}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible'){
    if (active) keepAwake(true);
    if (view === 'drive') render();
    if (sync.url && Date.now() - sync.lastOk > 60e3) doSync();
  }
});
window.addEventListener('online', () => { if (sync.url) doSync(); });

/* ============ Stop types ============ */
const TYPES = {
  start:{label:'Start', color:'#22c55e', ch:'S'},
  end:{label:'End', color:'#ef4444', ch:'E'},
  pickup:{label:'Pickup', color:'#3b82f6', ch:'P'},
  dropoff:{label:'Drop-off', color:'#f59e0b', ch:'D'},
  spark:{label:'Spark opened', color:'#a855f7', ch:'•'},
  gas:{label:'Gas', color:'#eab308', ch:'G'},
  break:{label:'Break', color:'#6b7280', ch:'B'},
  other:{label:'Other', color:'#71717a', ch:'O'}
};
const STOP_TYPES = ['pickup','dropoff','spark','gas','break','other'];

/* ============ Core calculations ============ */
function points(s){
  const pts = [];
  if (s.start){ s.start.type = 'start'; pts.push(s.start); }
  (s.stops || []).slice().sort((a,b) => a.t - b.t).forEach(x => pts.push(x));
  if (s.end){ s.end.type = 'end'; pts.push(s.end); }
  return pts;
}
function routeKey(s){ return points(s).filter(p => p.lat != null).map(p => p.lat.toFixed(5)+','+p.lon.toFixed(5)).join(';'); }
function straightMiles(s){
  const pts = points(s).filter(p => p.lat != null);
  if (pts.length < 2) return null;
  let d = 0; for (let i = 1; i < pts.length; i++) d += haversine(pts[i-1], pts[i]);
  return d * 1.25; // roads are ~25% longer than straight lines
}
function calc(s){
  const endT = (s.end && s.end.t) || Date.now();
  const hours = Math.max(0, (endT - s.start.t) / 3.6e6);
  const o1 = num(s.start.odo), o2 = num(s.end && s.end.odo);
  const odoMiles = (o1 != null && o2 != null && o2 >= o1) ? o2 - o1 : null;
  const routeOk = s.route && s.route.key === routeKey(s);
  const gpsMiles = routeOk ? s.route.miles : straightMiles(s);
  const override = num(s.milesOverride);
  let miles, source;
  if (override != null){ miles = override; source = 'Manual entry'; }
  else if (odoMiles != null){ miles = odoMiles; source = 'Odometer'; }
  else if (gpsMiles != null){ miles = gpsMiles; source = routeOk ? 'GPS road route (estimate)' : 'GPS straight-line (estimate)'; }
  else { miles = 0; source = 'None'; }
  const mpg = num(s.mpg) || settings.mpg, gasPrice = num(s.gasPrice) ?? settings.gasPrice, taxPct = num(s.taxPct) ?? settings.taxPct;
  const pay = num(s.pay) || 0, tips = num(s.tips) || 0;
  const expenses = (s.expenses || []).reduce((a, e) => a + (num(e.amt) || 0), 0);
  const gross = pay + tips;
  const gallons = mpg ? miles / mpg : 0;
  const gas = gallons * gasPrice;
  const net = gross - gas - expenses;
  const tax = Math.max(0, net) * taxPct / 100;
  const takeHome = net - tax;
  const irsRate = num(s.irsRate) ?? settings.irsRate;
  return { hours, miles, source, odoMiles, gpsMiles, pay, tips, gross, expenses, gallons, gas, net, tax, takeHome,
    hourlyGross: hours > 0 ? gross / hours : 0,
    hourlyTrue: hours > 0 ? takeHome / hours : 0,
    perMile: miles > 0 ? gross / miles : 0,
    irsDeduction: miles * irsRate, mpg, gasPrice, taxPct, irsRate };
}

/* ============ Routing (free OSRM service) ============ */
const geomCache = {};
async function fetchRoute(s){
  const pts = points(s).filter(p => p.lat != null);
  if (pts.length < 2) return null;
  const key = routeKey(s);
  if (s.route && s.route.key === key && geomCache[key]) return s.route;
  const coords = [], legs = [];
  for (let i = 0; i < pts.length - 1; i += 24){
    const chunk = pts.slice(i, i + 25);
    const url = 'https://router.project-osrm.org/route/v1/driving/' + chunk.map(p => p.lon.toFixed(6)+','+p.lat.toFixed(6)).join(';') + '?overview=full&geometries=geojson';
    const r = await fetch(url);
    if (!r.ok) throw new Error('route ' + r.status);
    const j = await r.json();
    if (j.code !== 'Ok') throw new Error(j.code);
    const rt = j.routes[0];
    rt.geometry.coordinates.forEach(c => coords.push([c[1], c[0]]));
    rt.legs.forEach(l => legs.push({m: l.distance, s: l.duration}));
  }
  geomCache[key] = coords;
  s.route = { key, legs, miles: legs.reduce((a, l) => a + l.m, 0) / 1609.344 };
  return s.route;
}

/* ============ Street addresses (free OpenStreetMap lookup) ============ */
/* Returns true only if new addresses were found. Never re-enters while running
   (a re-entrant call used to trigger an endless redraw loop that froze the app). */
/* Background queue: looks up one address per second (the free service's limit),
   one shift at a time. Keeps running while you use other tabs, saves after every
   address, updates the screen live, and refreshes the shift page when done. */
const geoTried = new Set(); // per app session, so failed lookups retry next time
const geoKey = p => p.lat + ',' + p.lon + ',' + p.t;
const geoTodo = s => points(s).filter(p => p.lat != null && !p.addr && !p.geoNone && !geoTried.has(geoKey(p)));
const geoQueue = [];
let geoRunning = false, geoProg = null;
const sleep = ms => new Promise(r => setTimeout(r, ms));
function queueGeocode(s, front){
  if (!s || (geoProg && geoProg.id === s.id) || !geoTodo(s).length) return;
  const i = geoQueue.indexOf(s.id); if (i >= 0) geoQueue.splice(i, 1);
  front ? geoQueue.unshift(s.id) : geoQueue.push(s.id);
  updateGeoUI();
  runGeoQueue();
}
async function lookupAddr(p){
  try{
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&lat=${p.lat}&lon=${p.lon}`);
    if (!r.ok) return null;
    const j = await r.json(); const a = j.address || {};
    const street = [a.house_number, a.road].filter(Boolean).join(' ');
    const city = a.city || a.town || a.village || a.suburb || '';
    const addr = [j.name && j.name !== a.road ? j.name : '', street, city].filter(Boolean).join(', ') || j.display_name || '';
    if (!addr) p.geoNone = true; // service answered but has no address here; don't keep asking
    return addr;
  }catch(e){ return null; }
}
async function runGeoQueue(){
  if (geoRunning) return;
  geoRunning = true;
  try{
    while (geoQueue.length){
      const id = geoQueue.shift();
      const s = shifts.find(x => x.id === id);
      const todo = s ? geoTodo(s) : [];
      if (!todo.length) continue;
      geoProg = { id, done: 0, total: todo.length };
      updateGeoUI();
      for (const p of todo){
        geoTried.add(geoKey(p));
        const addr = await lookupAddr(p);
        if (addr){ p.addr = addr; fillAddr(p); saveShifts(true); }
        geoProg.done++;
        updateGeoUI();
        await sleep(1100);
      }
      geoProg = null;
      if (view === 'detail' && detailId === id) render(); // final refresh (map pop-ups etc.)
      else updateGeoUI();
    }
  } finally { geoRunning = false; geoProg = null; updateGeoUI(); }
}
/* put a newly found address straight into whatever is on screen */
function fillAddr(p){
  const k = geoKey(p);
  document.querySelectorAll('[data-geo]').forEach(el => { if (el.dataset.geo === k) el.textContent = p.addr; });
}
function updateGeoUI(){
  const hdr = $('#hdr-geo');
  if (hdr) hdr.textContent = geoProg ? `📍 ${geoProg.done}/${geoProg.total}` : '';
  const box = $('#geo-status');
  if (!box) return;
  if (geoProg && geoProg.id === detailId){
    const left = Math.ceil((geoProg.total - geoProg.done) * 1.15);
    const pct = Math.round(geoProg.done / geoProg.total * 100);
    box.style.display = '';
    box.innerHTML = `<div class="spread small"><span>📍 Finding street addresses… <b>${geoProg.done} of ${geoProg.total}</b></span><span class="muted">${left > 0 ? 'about ' + (left >= 60 ? Math.floor(left/60) + 'm ' + (left%60) + 's' : left + 's') + ' left' : 'finishing…'}</span></div>
      <div class="pbar"><div style="width:${pct}%"></div></div>
      <div class="small muted" style="margin-top:6px">Fine to switch tabs — just keep the app open. This page refreshes itself when done.</div>`;
  } else if (geoQueue.includes(detailId)){
    box.style.display = '';
    box.innerHTML = `<div class="small">📍 Waiting to look up addresses (another shift is finishing first)…</div>`;
  } else {
    box.style.display = 'none';
    box.innerHTML = '';
  }
}

/* ============ Maps ============ */
let maps = {};
const routeInflight = new Set();
function pinIcon(type, n){
  const T = TYPES[type] || TYPES.other;
  return L.divIcon({className:'', html:`<div class="pin" style="background:${T.color}">${n ?? T.ch}</div>`, iconSize:[24,24], iconAnchor:[12,12]});
}
function drawMap(elId, s, opts = {}){
  if (typeof L === 'undefined'){ const el = document.getElementById(elId); if (el) el.innerHTML = '<div class="center muted small" style="padding:100px 0">Map needs an internet connection</div>'; return; }
  if (maps[elId]){ try{ maps[elId].remove(); }catch(e){} delete maps[elId]; }
  const el = document.getElementById(elId); if (!el) return;
  const m = L.map(el, {zoomControl:false, attributionControl:true});
  maps[elId] = m;
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(m);
  const pts = points(s).filter(p => p.lat != null);
  if (!pts.length){ m.setView([39.5, -98.35], 3); return; }
  const latlngs = pts.map(p => [p.lat, p.lon]);
  let stopN = 0;
  pts.forEach(p => {
    const label = (p.type === 'start' || p.type === 'end') ? null : ++stopN;
    L.marker([p.lat, p.lon], {icon: pinIcon(p.type, p.type === 'spark' ? label : label)})
      .addTo(m).bindPopup(`<b>${esc(TYPES[p.type]?.label || p.type)}</b> ${fmtTime(p.t)}${p.addr ? '<br>' + esc(p.addr) : ''}${p.note ? '<br>' + esc(p.note) : ''}`);
  });
  const key = routeKey(s);
  if (geomCache[key]) L.polyline(geomCache[key], {color:'#22c55e', weight:5, opacity:.85}).addTo(m);
  else L.polyline(latlngs, {color:'#22c55e', weight:3, dashArray:'6 8', opacity:.8}).addTo(m);
  if (latlngs.length === 1) m.setView(latlngs[0], 14); else m.fitBounds(latlngs, {padding:[30,30]});
  if (opts.route && !geomCache[key] && pts.length > 1 && !routeInflight.has(key)){
    routeInflight.add(key);
    fetchRoute(s)
      .then(() => { routeInflight.delete(key); if (geomCache[key] && opts.onRoute) opts.onRoute(); })
      .catch(() => { routeInflight.delete(key); });
  }
}

/* ---------- Spark log import ---------- */
function parseLog(txt){
  return txt.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    const m = l.match(/^(.+?)\s*[,|;]\s*(-?\d+(?:\.\d+)?)\s*[,|;]\s*(-?\d+(?:\.\d+)?)/);
    if (!m) return null;
    const t = Date.parse(m[1].trim());
    if (isNaN(t)) return null;
    return { t, lat: +m[2], lon: +m[3] };
  }).filter(Boolean);
}
function importIntoShift(s, entries){
  const from = s.start.t - 60e3, to = ((s.end && s.end.t) || Date.now()) + 60e3;
  let added = 0;
  entries.filter(e => e.t >= from && e.t <= to).sort((a,b) => a.t - b.t).forEach(e => {
    // skip if close in time AND place to an existing stop (Spark opens many times at one location)
    const dup = (s.stops || []).some(p => Math.abs(p.t - e.t) < 4*60e3 && (p.lat == null || haversine(p, e) < 0.1));
    if (dup) return;
    s.stops.push({ id: uid(), t: e.t, type: 'spark', lat: e.lat, lon: e.lon, auto: true });
    added++;
  });
  return added;
}
function openImport(s){
  const root = $('#modal-root');
  root.innerHTML = `<div class="modal"><div class="sheet">
    <div class="spread"><h2>Import Spark log</h2><button class="btn-link" id="i-close">Cancel</button></div>
    <p class="small muted">Pick the <b>SparkLog.txt</b> file your Shortcut creates (iCloud Drive → Shortcuts folder). Only entries during this shift are added, and repeats at the same spot are skipped.</p>
    <input type="file" id="i-file" accept=".txt,text/plain">
    <label>…or paste the log text</label>
    <textarea id="i-text" placeholder="2026-10-07T17:47:00-07:00,33.4484,-112.0740"></textarea>
    <div style="height:12px"></div>
    <button class="btn-go" id="i-go">Import</button>
  </div></div>`;
  $('#i-close').onclick = () => root.innerHTML = '';
  $('#i-file').onchange = async e => { const f = e.target.files[0]; if (f) $('#i-text').value = await f.text(); };
  $('#i-go').onclick = () => {
    const entries = parseLog($('#i-text').value);
    if (!entries.length){ toast('No log entries found in that text'); return; }
    const n = importIntoShift(s, entries);
    if (s === active) saveActive(); else saveShifts();
    root.innerHTML = '';

    render();
    if (s !== active) queueGeocode(s, true);
  };

/* ---------- Summary ---------- */
const PERIODS = { today:'Today', week:'This week', lastweek:'Last week', month:'This month', lastmonth:'Last month', year:'This year', all:'All time' };
function periodRange(p){
  const now = new Date(), d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const monday = new Date(d0); monday.setDate(d0.getDate() - ((d0.getDay() + 6) % 7));
  switch (p){
    case 'today': return [d0.getTime(), Infinity];
    case 'week': return [monday.getTime(), Infinity];
    case 'lastweek': { const a = new Date(monday); a.setDate(a.getDate() - 7); return [a.getTime(), monday.getTime()]; }
    case 'month': return [new Date(now.getFullYear(), now.getMonth(), 1).getTime(), Infinity];
    case 'lastmonth': return [new Date(now.getFullYear(), now.getMonth() - 1, 1).getTime(), new Date(now.getFullYear(), now.getMonth(), 1).getTime()];
    case 'year': return [new Date(now.getFullYear(), 0, 1).getTime(), Infinity];
    default: return [0, Infinity];
  }
}
function shiftsIn(p){ const [a, b] = periodRange(p); return shifts.filter(s => s.start.t >= a && s.start.t < b).sort((x,y) => x.start.t - y.start.t); }
function totals(list){
  const t = { n: list.length, hours:0, miles:0, pay:0, tips:0, gross:0, gas:0, gallons:0, expenses:0, net:0, tax:0, takeHome:0, irs:0, stops:0 };
  list.forEach(s => { const c = calc(s); t.hours += c.hours; t.miles += c.miles; t.pay += c.pay; t.tips += c.tips; t.gross += c.gross; t.gas += c.gas; t.gallons += c.gallons; t.expenses += c.expenses; t.net += c.net; t.tax += c.tax; t.takeHome += c.takeHome; t.irs += c.irsDeduction; t.stops += (s.stops||[]).length; });
  t.hourlyGross = t.hours ? t.gross / t.hours : 0; t.hourlyTrue = t.hours ? t.takeHome / t.hours : 0; t.perMile = t.miles ? t.gross / t.miles : 0;
  return t;
}
/* ---------- Bar chart ---------- */
const fmtMD = d => new Date(d).toLocaleDateString([], {month:'short', day:'numeric'});
const sameDay = (a, b) => { a = new Date(a); b = new Date(b); return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); };
const dayStart = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const mondayOf = d => addDays(dayStart(d), -((d.getDay() + 6) % 7));
function chartBuckets(p){
  const now = new Date();
  const B = [];
  let title = '', divider = -1;
  if (p === 'today' || p === 'week' || p === 'lastweek'){
    // Mon–Sun, weekend split off with a divider (same layout as Spark)
    const m = p === 'lastweek' ? addDays(mondayOf(now), -7) : mondayOf(now);
    const names = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    for (let i = 0; i < 7; i++){
      const a = addDays(m, i);
      B.push({ a: a.getTime(), b: addDays(m, i + 1).getTime(), top: names[i], sub: String(a.getDate()), future: a > now, today: sameDay(a, now) });
    }
    divider = 5;
    title = `${fmtMD(m)} – ${fmtMD(addDays(m, 6))}`;
  } else if (p === 'month' || p === 'lastmonth'){
    // one bar per week (Mon–Sun) of the month
    const ms = new Date(now.getFullYear(), now.getMonth() - (p === 'lastmonth' ? 1 : 0), 1);
    const me = new Date(ms.getFullYear(), ms.getMonth() + 1, 1);
    for (let w = mondayOf(ms); w < me; w = addDays(w, 7)){
      const a = w < ms ? ms : w, e = addDays(w, 7), b = e > me ? me : e;
      const last = addDays(b, -1);
      B.push({ a: a.getTime(), b: b.getTime(), top: `${a.getMonth()+1}/${a.getDate()}`, sub: `thru ${last.getMonth()+1}/${last.getDate()}`, future: a > now, today: now >= a && now < b });
    }
    title = ms.toLocaleDateString([], {month:'long', year:'numeric'}) + ' · by week';
  } else {
    // this year → by month; all time → by month, or by year if it spans several years
    const years = shifts.map(s => new Date(s.start.t).getFullYear());
    const y0 = p === 'all' && years.length ? Math.min(...years) : now.getFullYear();
    if (p === 'all' && y0 < now.getFullYear()){
      for (let y = y0; y <= now.getFullYear(); y++)
        B.push({ a: new Date(y,0,1).getTime(), b: new Date(y+1,0,1).getTime(), top: String(y), sub: '', future: false, today: y === now.getFullYear() });
      title = 'All time · by year';
    } else {
      for (let mth = 0; mth < 12; mth++){
        const a = new Date(y0, mth, 1);
        B.push({ a: a.getTime(), b: new Date(y0, mth + 1, 1).getTime(), top: a.toLocaleDateString([], {month:'narrow'}), sub: '', future: a > now, today: mth === now.getMonth() && y0 === now.getFullYear() });
      }
      title = `${y0} · by month`;
    }
  }
  B.forEach(x => {
    const list = shifts.filter(s => s.start.t >= x.a && s.start.t < x.b);
    x.gross = 0; x.miles = 0;
    list.forEach(s => { const c = calc(s); x.gross += c.gross; x.miles += c.miles; });
  });
  return { B, title, divider };
}
function chartHTML(p){
  const { B, title, divider } = chartBuckets(p);
  const compact = B.length > 7;
  const max = Math.max(...B.map(x => x.gross), 1);
  const H = 130; // px for the tallest bar
  const val = v => !v ? '' : compact ? (v >= 1000 ? '$' + (v/1000).toFixed(1) + 'k' : '$' + Math.round(v)) : '$' + v.toFixed(2);
  const totG = B.reduce((a, x) => a + x.gross, 0), totM = B.reduce((a, x) => a + x.miles, 0);
  const cols = B.map((x, i) => {
    const h = x.gross > 0 ? Math.max(6, Math.round(x.gross / max * H)) : 0;
    const miTxt = Math.round(x.miles) + (compact ? '' : '<br>miles');
    const inside = x.gross > 0 && x.miles > 0 && h >= (compact ? 22 : 34);
    return `<div class="bcol ${i === divider ? 'div' : ''} ${x.future ? 'future' : ''} ${x.today ? 'today' : ''}">
      <div class="bwrap">
        ${!inside && x.miles > 0 ? `<div class="bmi-out">${Math.round(x.miles)} mi</div>` : ''}
        <div class="bval">${val(x.gross)}</div>
        <div class="bar ${h ? '' : 'zero'}" style="height:${h}px">${inside ? miTxt : ''}</div>
      </div>
      <div class="blab"><b>${x.top}</b>${x.sub}</div>
    </div>`;
  }).join('');
  return `<div class="card">
    <div class="chart-head"><b>Earnings</b><span class="small muted">${esc(title)}</span></div>
    <div class="bars ${compact ? 'compact' : ''}" style="grid-template-columns:repeat(${B.length},1fr)">${cols}</div>
    <div class="spread small" style="margin-top:10px;border-top:1px solid var(--line);padding-top:8px">
      <span class="muted">Gross Pay (pay + tips) · miles in bars</span><b>${money(totG)} · ${totM.toFixed(0)} mi</b></div>
  </div>`;
}

/* ---------- Export / backup ---------- */
async function shareOrDownload(name, text, type){
  const blob = new Blob([text], {type});
  const file = new File([blob], name, {type});
  if (navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:name}); return; }catch(e){ if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function csvCell(v){ v = String(v ?? ''); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function exportCSV(list){
  if (!list.length){ toast('No shifts in this period'); return; }
  const head = ['Date','Start time','End time','Hours','Start location','End location','Start odometer','End odometer','Business miles','Miles source','Business purpose','Stops (in order)','Pay','Tips','Gross','Est gas cost','Other expenses','Net before tax','Est tax','Take-home','Gross $/hr','True $/hr','IRS deduction'];
  const rows = list.map(s => {
    const c = calc(s);
    const stops = (s.stops||[]).slice().sort((a,b)=>a.t-b.t).map(p => `${fmtTime(p.t)} ${TYPES[p.type]?.label || p.type}${p.addr ? ' @ ' + p.addr : ''}`).join(' | ');
    return [fmtDateShort(s.start.t), fmtTime(s.start.t), fmtTime(s.end.t), c.hours.toFixed(2),
      [s.start.label, s.start.addr].filter(Boolean).join(' – '), [s.end.label, s.end.addr].filter(Boolean).join(' – '),
      s.start.odo ?? '', s.end.odo ?? '', c.miles.toFixed(1), c.source, settings.purpose, stops,
      c.pay.toFixed(2), c.tips.toFixed(2), c.gross.toFixed(2), c.gas.toFixed(2), c.expenses.toFixed(2), c.net.toFixed(2), c.tax.toFixed(2), c.takeHome.toFixed(2),
      c.hourlyGross.toFixed(2), c.hourlyTrue.toFixed(2), c.irsDeduction.toFixed(2)];
  });
  const t = totals(list);
  rows.push(['TOTAL','','',t.hours.toFixed(2),'','','','',t.miles.toFixed(1),'','','',t.pay.toFixed(2),t.tips.toFixed(2),t.gross.toFixed(2),t.gas.toFixed(2),t.expenses.toFixed(2),t.net.toFixed(2),t.tax.toFixed(2),t.takeHome.toFixed(2),t.hourlyGross.toFixed(2),t.hourlyTrue.toFixed(2),t.irs.toFixed(2)]);
  const csv = [head, ...rows].map(r => r.map(csvCell).join(',')).join('\n');
  shareOrDownload(`mileage-log-${period}-${new Date().toISOString().slice(0,10)}.csv`, csv, 'text/csv');
}
function backup(){
  const data = { app:'mileage-tracker', version:1, exported:new Date().toISOString(), settings, shifts, active };
  shareOrDownload(`mileage-backup-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(data), 'application/json');
  LS.set('mt_lastBackup', Date.now());
}
async function restore(e){
  const f = e.target.files[0]; if (!f) return;
  try{
    const data = JSON.parse(await f.text());
    if (data.app !== 'mileage-tracker' || !Array.isArray(data.shifts)) throw 0;
    const ids = new Set(shifts.map(s => s.id));
    const incoming = data.shifts.filter(s => !ids.has(s.id));
    if (!confirm(`Backup has ${data.shifts.length} shifts. Add the ${incoming.length} you don't already have?`)) return;
    shifts = shifts.concat(incoming); saveShifts();
    toast(`Restored ${incoming.length} shifts`); render();
  }catch(err){ toast('That file is not a Mileage Tracker backup'); }
}

      Est. gas = miles ÷ MPG × gas price. Net before tax = pay + tips − gas − other expenses. Est. tax = your % of net. Take-home = net − tax.
      True hourly = take-home ÷ hours from start to end of shift.<br><br>
      Self-employment tax alone is 15.3%, so 25–30% is a common set-aside. The IRS business rate was 72.5¢ for Jan–Jun 2026 and 76¢ from July 1, 2026 — check irs.gov each year.
    </div>
    <div class="card small muted">
      <b style="color:var(--text)">Your data</b><br>
      ${sync.url ? 'Saved on this device and synced to your Google Sheet.' : 'Everything is stored only on this device.'} ${shifts.length} shifts saved. Last backup: ${lb ? fmtDate(lb) : 'never'}.
      Back up weekly from the Summary tab and save the file to iCloud Drive.
      <div style="height:10px"></div>
      <button id="s-wipe" style="background:none;color:var(--red)">Erase all data</button>
    </div>`;
  $('#y-go').onclick = async () => {
    const url = $('#y-url').value.trim(), key = $('#y-key').value.trim();
    if (!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(url)){ toast('That doesn\'t look like the web app address — it starts with https://script.google.com/', 4000); return; }
    if (!key){ toast('Enter the sync password you put in the script'); return; }
    if (url !== sync.url){ // new sheet: send everything on this device
      sync = Object.assign(sync, { url, since:0, lastPush:0, settingsPushed:0, lastOk:0, err:'' });
      shifts.forEach(x => pending.add(x.id)); savePending();
    }
    sync.key = key; saveSync();
    $('#y-go').disabled = true; $('#y-go').textContent = 'Syncing…';
    const ok = await doSync(true);
    render();
    if (ok) toast(`✅ Connected — ${shifts.length} shift${shifts.length === 1 ? '' : 's'} in sync`, 3500);
  };
  $('#y-off').onclick = () => {
    if (!confirm('Stop syncing this device? Your shifts stay on this device and in the sheet.')) return;
    sync = { url:'', key:'', since:0, lastPush:0, settingsPushed:0, lastOk:0, err:'' }; saveSync(); render();
  };
  $('#s-save').onclick = () => {
    settings.mpg = num($('#s-mpg').value) || DEFAULTS.mpg;
    settings.gasPrice = num($('#s-gp').value) ?? DEFAULTS.gasPrice;
    settings.taxPct = num($('#s-tax').value) ?? DEFAULTS.taxPct;
    settings.irsRate = num($('#s-irs').value) ?? DEFAULTS.irsRate;
    settings.homeLabel = $('#s-home').value.trim() || 'Home';
    settings.purpose = $('#s-purpose').value.trim() || DEFAULTS.purpose;
    saveSettings(); toast('✅ Settings saved');
  };
  $('#s-wipe').onclick = () => {
    if (confirm('Erase ALL shifts and settings from this device? (Your Google Sheet is not touched.)') && confirm('Are you sure? Make a backup first if unsure.')){
      shifts = []; active = null; localStorage.clear(); settings = Object.assign({}, DEFAULTS);
      hashes = {}; tomb = []; pending = new Set(); sync = { url:'', key:'', since:0, lastPush:0, settingsPushed:0, lastOk:0, err:'' };
      render(); toast('All data erased from this device');
    }
  };
}

/* ============ Boot ============ */
if (active) view = 'drive';
render();
shifts.slice().sort((a,b) => b.start.t - a.start.t).forEach(s => queueGeocode(s));
if (sync.url) doSync();
</script>
</body>
</html>
